[project]
name = "sprintflow-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
