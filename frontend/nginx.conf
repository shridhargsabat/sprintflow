server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MOB-LOW-C/C2: compress static text (JS/CSS/SVG/JSON/HTML). Hashed
    # /assets/ stay immutable-cached (below) — no stale-immutable risk.
    # woff2 is deliberately NOT listed: it's already internally compressed,
    # so gzip would burn CPU for ~0 bytes saved. (Stock nginx image has no
    # brotli module, so gzip only — no custom module build.)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API reverse-proxy to the backend container (same compose network).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets: cache hard (Vite emits hashed filenames).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: everything else serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
